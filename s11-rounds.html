<head>

  <style>
    body { font-family: Inter, sans-serif; }
    .race-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.125rem;
      height: 1.125rem;
      border-radius: 9999px;
      font-size: 0.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      flex-shrink: 0;
      line-height: 1;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35) inset;
    }
    .race-pill-Z { background: linear-gradient(145deg, #be123c, #881337); }
    .race-pill-T { background: linear-gradient(145deg, #0369a1, #0c4a6e); }
    .race-pill-P { background: linear-gradient(145deg, #ca8a04, #854d0e); }
    .race-pill-R {
      background: linear-gradient(145deg, #57534e, #292524);
      font-size: 0.48rem;
    }
    .race-pill-? { background: linear-gradient(145deg, #71717a, #3f3f46); font-size: 0.45rem; }
    .sub-tab {
      color: #52525b;
      border: 1px solid transparent;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .sub-tab:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #e4e4e7;
    }
    .sub-tab.active {
      background: linear-gradient(165deg, #4f46e5 0%, #4338ca 100%);
      color: #fff;
      font-weight: 600;
      border-color: #4338ca;
      box-shadow: 0 1px 2px rgba(67, 56, 202, 0.25);
    }
    .rounds-half-tab {
      border-radius: 0.375rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #52525b;
      transition: background 0.15s ease, color 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .rounds-half-tab:hover { color: #312e81; background: #eef2ff; }
    .rounds-half-tab.is-active {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: #fff;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.35);
    }
    .round-pane.hidden { display: none; }
    .round-team-logo-frame {
      position: relative;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.4rem;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(180deg, #fafafa 0%, #f4f4f5 100%);
      border: 1px solid #e4e4e7;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    @media (min-width: 640px) {
      .round-team-logo-frame {
        width: 2.875rem;
        height: 2.875rem;
      }
    }
    .round-team-logo-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }
    .round-team-logo-fallback {
      font-size: 0.5625rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #52525b;
    }
    @media (max-width: 767px) {
      #roundTabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.375rem;
      }
      #roundTabs .sub-tab {
        min-height: 2.75rem;
        width: 100%;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        font-size: 0.8125rem;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #roundTabs .sub-tab:nth-child(10):last-child {
        grid-column: 2 / 3;
      }
      #main { padding: 0.75rem; }
      .round-slot-compact {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.4rem 0.45rem;
        border-bottom: 1px solid rgba(228, 228, 231, 0.85);
        background: #fff;
        font-size: 10px;
        line-height: 1.2;
      }
      .round-slot-compact:last-child { border-bottom: none; }
      .round-slot-compact__meta {
        flex-shrink: 0;
        width: 2.75rem;
        font-size: 8px;
        color: #71717a;
        text-align: center;
        line-height: 1.15;
      }
      .round-slot-compact__meta .slot-num {
        font-size: 10px;
        font-weight: 800;
        color: #4338ca;
      }
      .round-slot-compact__meta .slot-type {
        font-size: 11px;
        font-weight: 800;
        line-height: 1.1;
        margin-top: 0.1rem;
      }
      .tier-short--god { color: #7c3aed; }
      .tier-short--king { color: #b45309; }
      .tier-short--human { color: #0369a1; }
      .tier-short--animal { color: #047857; }
      .tier-short--amoeba { color: #57534e; }
      .tier-short--team { color: #6d28d9; }
      .round-slot-compact__side {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.1rem 0.2rem;
        padding: 0.25rem 0.3rem;
        border-radius: 0.35rem;
      }
      .round-slot-compact__side--win {
        color: #047857;
        font-weight: 700;
        background: rgba(209, 250, 229, 0.92);
        border: 1px solid rgba(16, 185, 129, 0.28);
      }
      .round-slot-compact__side--lose {
        color: #71717a;
        font-weight: 500;
        background: rgba(250, 250, 250, 0.95);
        border: 1px solid rgba(228, 228, 231, 0.95);
      }
      .round-slot-compact--decided {
        background: linear-gradient(90deg, rgba(240, 253, 244, 0.35) 0%, #fff 50%, rgba(250, 250, 250, 0.5) 100%);
      }
      .round-slot-compact__sep {
        flex-shrink: 0;
        color: #d4d4d8;
        font-size: 8px;
        font-weight: 800;
        padding: 0 0.1rem;
      }
      .round-slot-inline-name {
        display: inline-flex;
        align-items: center;
        gap: 0.1rem;
        white-space: nowrap;
        max-width: 100%;
      }
      .round-slot-inline-name .race-pill {
        width: 0.875rem;
        height: 0.875rem;
        font-size: 0.45rem;
      }
      .round-slot-inline-name--win { color: #047857; }
      .round-slots-mobile-wrap {
        border-radius: 0.65rem;
        border: 1px solid rgba(228, 228, 231, 0.9);
        overflow: hidden;
      }
    }
  </style>

<body class="bg-zinc-100 text-zinc-800 min-h-screen text-sm antialiased">

    <div id="loading" class="rounded-xl border border-zinc-200 bg-white p-10 text-center text-zinc-500 shadow-sm">불러오는 중…</div>

          <button type="button" class="rounds-half-tab is-active" data-rounds-half="second_half" role="tab" aria-selected="true">하반기 <span class="hidden sm:inline">(11R~20R)</span></button>

  <script type="module">
    import { loadSingleRoundDoc, loadResultsManifest } from './js/s11-data-loader.mjs';
    import { HALF_RANGES, defaultHalfKey } from './js/s11-coin-usage.mjs';

    const SCHEDULE_DATE_YEAR = 2026;

    /** manifest matchResults 에 있는 가장 최근 라운드 번호 (결과 파일이 있는 라운드) */
    function latestResultRoundFromManifest(manifest, availableRounds) {
      const allowed = new Set((availableRounds || []).map((n) => Number(n)));
      let max = 0;
      for (const id of manifest?.matchResults || []) {
        const m = String(id).match(/-r(\d+)/i);
        if (!m) continue;
        const r = Number(m[1]);
        if (!Number.isFinite(r) || r < 1) continue;
        if (allowed.size && !allowed.has(r)) continue;
        if (r > max) max = r;
      }
      return max > 0 ? max : null;
    }

    function roundsInHalf(allRounds, halfKey) {
      const range = HALF_RANGES[halfKey] || HALF_RANGES.second_half;
      return (allRounds || []).filter((r) => {
        const n = Number(r.round) || 0;
        return n >= range.min && n <= range.max;
      });
    }

    function pickInitialRoundForHalf(halfRounds, manifest) {
      if (!halfRounds.length) return null;
      const nums = halfRounds.map((r) => r.round);
      const latest = latestResultRoundFromManifest(manifest, nums);
      if (latest != null && nums.includes(latest)) return latest;
      return halfRounds[0].round;
    }

    async function loadJson(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(path + ' ' + res.status);
      return res.json();
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function teamName(meta, id) {
      const t = meta.teams.find((x) => x.id === id);
      return t ? t.name : id;
    }

    function teamMeta(meta, id) {
      return (meta.teams || []).find((x) => x.id === id) || null;
    }

    const TEAM_LOGO_SRC = {
      t1: 's11_1.jpg',
      t2: 's11_2.jpg',
      t3: 's11_3.png',
      t4: 's11_4.png',
      t5: 's11_5.png',
      t6: 's11_6.jpg',
    };

    function teamLogoSrc(teamId) {
      if (!teamId) return '';
      return TEAM_LOGO_SRC[teamId] || '';
    }

    function formatRoundTeamLogo(teamId, t) {
      const src = teamLogoSrc(teamId);
      if (!src) return '';
      const short = (t?.short && String(t.short).trim()) || (t?.name && String(t.name).slice(0, 2)) || '?';
      const title = escapeHtml(t?.name || teamId || '');
      return `<span class="round-team-logo-frame relative inline-flex items-center justify-center" title="${title}">
        <img src="${escapeHtml(src)}" alt="" class="round-team-logo-img" decoding="async" onerror="this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden')" />
        <span class="round-team-logo-fallback hidden absolute inset-0 flex items-center justify-center bg-zinc-200">${escapeHtml(short)}</span>
      </span>`;
    }

    function formatTeamMatchupHeader(meta, teamId, align, nameCls) {
      const t = teamMeta(meta, teamId);
      const name = escapeHtml(t ? t.name : teamId);
      const short = t?.short && String(t.short).trim();
      const shortHtml = short
        ? ` <span class="text-[11px] sm:text-xs font-semibold text-indigo-700/85 tracking-tight">(${escapeHtml(short)})</span>`
        : '';
      const logo = formatRoundTeamLogo(teamId, t);
      const label = `<div class="min-w-0 ${nameCls} text-sm sm:text-base leading-snug break-words"><span>${name}</span>${shortHtml}</div>`;
      if (align === 'end') {
        return `<div class="flex items-center justify-end gap-2 min-w-0">${label}${logo}</div>`;
      }
      return `<div class="flex items-center justify-start gap-2 min-w-0">${logo}${label}</div>`;
    }

    function raceKo(letter) {
      const c = letter && String(letter).toUpperCase().charAt(0);
      const m = { Z: '저그', T: '테란', P: '토스', R: '랜덤' };
      return m[c] || '';
    }

    /** 칩 왼쪽 액센트만 종족색 (배경은 흰색 유지) */
    function raceAccentBorder(letter) {
      const c = letter && String(letter).toUpperCase().charAt(0);
      if (c === 'Z') return 'border-l-rose-500';
      if (c === 'T') return 'border-l-sky-600';
      if (c === 'P') return 'border-l-amber-500';
      if (c === 'R') return 'border-l-stone-500';
      return 'border-l-zinc-300';
    }

    function racePillClass(letter) {
      const c = letter && String(letter).toUpperCase().charAt(0);
      if (c === 'Z') return 'race-pill race-pill-Z';
      if (c === 'T') return 'race-pill race-pill-T';
      if (c === 'P') return 'race-pill race-pill-P';
      if (c === 'R') return 'race-pill race-pill-R';
      return 'race-pill race-pill-?';
    }

    function racePill(letter) {
      const c = letter && String(letter).toUpperCase().charAt(0);
      const lab = c === 'Z' || c === 'T' || c === 'P' || c === 'R' ? c : '?';
      const tip = raceKo(lab === '?' ? '' : lab) || (lab === '?' ? '미등록' : lab);
      return `<span class="${racePillClass(c)}" title="${escapeHtml(tip)}">${lab}</span>`;
    }

    function slotPlanBySlot(roundDef) {
      const m = new Map();
      for (const s of roundDef.slotPlan || []) m.set(s.slot, s);
      return m;
    }

    function parseScheduleMdDate(str, year) {
      const m = String(str).trim().match(/^(\d{1,2})\/(\d{1,2})$/);
      if (!m) return null;
      const month = parseInt(m[1], 10) - 1;
      const day = parseInt(m[2], 10);
      if (month < 0 || month > 11 || day < 1 || day > 31) return null;
      const d = new Date(year, month, day);
      if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return null;
      return d;
    }

    function pairMod5KeyForRound(roundNum) {
      const r = Number(roundNum);
      if (!Number.isFinite(r)) return null;
      const mod = ((r % 5) + 5) % 5;
      return mod === 0 ? '0' : String(mod);
    }

    function presetPairRowsForRound(roundNum, matchupPreset) {
      if (!matchupPreset) return null;
      if (matchupPreset.pairsByRound && typeof matchupPreset.pairsByRound === 'object') {
        const key = String(Number(roundNum));
        const rows = matchupPreset.pairsByRound[key];
        if (Array.isArray(rows)) return rows;
      }
      if (!matchupPreset.pairsByRoundMod5) return null;
      const key = pairMod5KeyForRound(roundNum);
      if (key == null) return null;
      const rows = matchupPreset.pairsByRoundMod5[key];
      return Array.isArray(rows) ? rows : null;
    }

    function unorderedPairKey(teamIds) {
      const [a, b] = teamIds || [];
      if (!a || !b) return '';
      return a < b ? `${a}\u0000${b}` : `${b}\u0000${a}`;
    }

    function presetSlotIndexForTeams(teamIds, roundNum, matchupPreset) {
      const rows = presetPairRowsForRound(roundNum, matchupPreset);
      if (!rows) return 999;
      const want = unorderedPairKey(teamIds);
      if (!want) return 999;
      for (let i = 0; i < rows.length; i++) {
        if (unorderedPairKey(rows[i]) === want) return i;
      }
      return 999;
    }

    function matchupSortKeyFromId(id) {
      const m = String(id || '').match(/-m(\d+)$/);
      return m ? parseInt(m[1], 10) : 999;
    }

    /** index.html 일정표와 동일: pairsByRound 행 순 → 날짜 → fixture id */
    function sortMatchupsForDisplay(matchups, roundNum, fixtures) {
      const mp = fixtures && fixtures.matchupPreset;
      return [...(matchups || [])].sort((a, b) => {
        const ia = presetSlotIndexForTeams(a.teamIds, roundNum, mp);
        const ib = presetSlotIndexForTeams(b.teamIds, roundNum, mp);
        if (ia !== ib) return ia - ib;
        const da = parseScheduleMdDate(String(a.date || '').trim(), SCHEDULE_DATE_YEAR);
        const db = parseScheduleMdDate(String(b.date || '').trim(), SCHEDULE_DATE_YEAR);
        const ta = da ? da.getTime() : null;
        const tb = db ? db.getTime() : null;
        if (ta != null && tb != null && ta !== tb) return ta - tb;
        if (ta != null && tb == null) return -1;
        if (ta == null && tb != null) return 1;
        return matchupSortKeyFromId(a.id) - matchupSortKeyFromId(b.id);
      });
    }

    function resultMatchupByFixtureId(doc, fixtureId) {
      if (!doc || !doc.matchups) return null;
      return doc.matchups.find((x) => x.fixtureId === fixtureId) || null;
    }

    function countSlotWins(slots) {
      let a = 0;
      let b = 0;
      for (const sl of slots || []) {
        if (sl.winnerTeamIndex === 1) a++;
        else if (sl.winnerTeamIndex === 2) b++;
      }
      return [a, b];
    }

    /** 표시용 세트 스코어: series에 점수 있으면 우선, 없으면 슬롯 집계 */
    function displayedSetScores(resMu) {
      const s = resMu && resMu.series;
      const [ca, cb] = countSlotWins(resMu && resMu.slots);
      if (s && s.setScoreTeamA != null && s.setScoreTeamB != null) {
        const na = Number(s.setScoreTeamA);
        const nb = Number(s.setScoreTeamB);
        if (!Number.isNaN(na) && !Number.isNaN(nb)) return [na, nb];
      }
      return [ca, cb];
    }

    function matchupMvpName(resMu) {
      const raw = resMu?.series?.mvp ?? resMu?.mvp ?? null;
      if (!raw) return '';
      if (typeof raw === 'string') return raw.trim();
      return String(raw.displayName || raw.playerName || '').trim();
    }

    function formatMvpBadge(resMu, rosterMap) {
      const name = matchupMvpName(resMu);
      if (!name) return '';
      const p = rosterMap.get(name);
      const race = p && String(p.tierSheetMainRace || p.raceDefault || '').toUpperCase().charAt(0);
      const id = p && p.id ? `<span class="font-mono text-[10px] text-amber-700/70">${escapeHtml(p.id)}</span>` : '';
      return `<div class="px-4 py-2 border-b border-amber-100 bg-amber-50/70 text-center">
        <span class="inline-flex flex-wrap items-center justify-center gap-1.5 rounded-full border border-amber-200 bg-white/85 px-3 py-1 text-xs font-bold text-amber-900 shadow-sm">
          <span class="text-amber-500">MVP</span>
          ${racePill(race)}
          <span>${escapeHtml(name)}</span>
          ${id}
        </span>
      </div>`;
    }

    function rosterByDisplayName(players) {
      const m = new Map();
      for (const p of players || []) {
        const dn = (p.displayName || '').trim();
        if (dn) m.set(dn, p);
      }
      return m;
    }

    /** JSON race 없을 때 players.json 메인 종족 */
    function resolvedRaceLetter(row, rosterMap) {
      const raw = row?.race && String(row.race).trim().toUpperCase();
      if (raw) {
        const c = raw.charAt(0);
        if (c === 'Z' || c === 'T' || c === 'P' || c === 'R') return c;
      }
      const p = rosterMap.get((row.displayName || '').trim());
      const letter = String((p && (p.tierSheetMainRace || p.raceDefault)) || '')
        .trim()
        .toUpperCase()
        .charAt(0);
      if (letter === 'Z' || letter === 'T' || letter === 'P' || letter === 'R') return letter;
      return '';
    }

    /** 선수 칩: 이름 한 줄 · ID는 아래 작게 (종족은 왼쪽 컬러 바만) */
    function slotPlayerCompact(row, rosterMap, align) {
      const dn = (row.displayName || '').trim();
      if (!dn) return '';
      const p = rosterMap.get(dn);
      const letter = resolvedRaceLetter(row, rosterMap);
      const bgLetter = letter || (p && String(p.tierSheetMainRace || p.raceDefault || '').toUpperCase().charAt(0)) || '';
      const accent = raceAccentBorder(bgLetter);
      const colAlign =
        align === 'end' ? 'items-end text-right' : align === 'center' ? 'items-center text-center' : 'items-start text-left';
      const pid = (p && p.id) || '';
      const pidEsc = escapeHtml(pid);
      const capMark = p && p.isCaptain ? '<span class="text-amber-500 text-[10px] font-bold" title="팀장">★</span>' : '';
      const tip = [raceKo(letter), dn].filter(Boolean).join(' · ');
      const idAlign = align === 'end' ? 'text-right' : align === 'center' ? 'text-center' : 'text-left';
      const idLine = pid
        ? `<span class="text-[10px] font-mono text-zinc-400 tabular-nums tracking-tight max-w-full truncate block w-full ${idAlign}">${pidEsc}</span>`
        : `<span class="text-[10px] text-zinc-300 w-full ${idAlign}">—</span>`;
      const rowJustify =
        align === 'end' ? 'justify-end' : align === 'center' ? 'justify-center' : 'justify-start';
      return `<div class="inline-flex flex-col gap-0.5 min-w-0 max-w-[14rem] rounded-lg border border-zinc-200/70 bg-white/95 px-2 py-1.5 shadow-sm ${accent} border-l-[3px] ${colAlign}" title="${escapeHtml(tip)}">
        <div class="flex ${rowJustify} items-center gap-1.5 min-w-0 w-full">
          ${racePill(letter)}
          <span class="text-xs font-semibold text-zinc-900 truncate">${escapeHtml(dn)}</span>${capMark}
        </div>
        ${idLine}
      </div>`;
    }

    function formatRoster(rows, rosterMap, align) {
      const list = (rows || []).filter((r) => (r.displayName || '').trim());
      if (!list.length) return '<span class="text-zinc-400 text-xs">—</span>';
      const justify =
        align === 'end' ? 'justify-end' : align === 'center' ? 'justify-center' : 'justify-start';
      const items = list.map((r) => slotPlayerCompact(r, rosterMap, align)).join('');
      return `<div class="flex flex-wrap gap-2 ${justify}">${items}</div>`;
    }

    function tierLineShort(tierLine) {
      const t = String(tierLine || '').trim();
      const map = { 갓: '갓', 킹: '킹', 휴먼: '휴', 애니멀: '애', 아메바: '아' };
      return map[t] || '';
    }

    function tierShortClass(tierLine, format) {
      const t = String(tierLine || '').trim();
      if (t === '갓') return 'tier-short--god';
      if (t === '킹') return 'tier-short--king';
      if (t === '휴먼') return 'tier-short--human';
      if (t === '애니멀') return 'tier-short--animal';
      if (t === '아메바') return 'tier-short--amoeba';
      if (format === '2v2' || format === '3v3') return 'tier-short--team';
      return '';
    }

    /** 슬롯 유형 라벨: 1v1 → 티어 약어(애·휴·킹·갓·아), 팀전 → 2:2 / 3:3 */
    function formatSlotTypeLabel(plan) {
      if (!plan) return '—';
      if (plan.format === '2v2') return '2:2';
      if (plan.format === '3v3') return '3:3';
      const short = tierLineShort(plan.tierLine);
      if (short) return short;
      if (plan.format === '1v1') return '1v1';
      return plan.format || '—';
    }

    function formatSlotTypeBadge(plan) {
      if (!plan) return '';
      const label = formatSlotTypeLabel(plan);
      const cls = tierShortClass(plan.tierLine, plan.format);
      if (plan.format === '2v2') {
        return '<span class="inline-flex rounded-full bg-fuchsia-50 text-fuchsia-800 px-2 py-0.5 text-[10px] font-semibold leading-none ring-1 ring-inset ring-fuchsia-200/50">2:2</span>';
      }
      if (plan.format === '3v3') {
        return '<span class="inline-flex rounded-full bg-violet-50 text-violet-800 px-2 py-0.5 text-[10px] font-semibold leading-none ring-1 ring-inset ring-violet-200/50">3:3</span>';
      }
      const tone = cls || 'tier-short--human';
      return `<span class="inline-flex rounded-full bg-sky-50/90 text-sky-900 px-1.5 py-0.5 text-[10px] font-bold leading-none ring-1 ring-inset ring-sky-200/50 slot-type-badge ${tone}">${escapeHtml(label)}</span>`;
    }

    function formatSlotTypeMetaHtml(plan) {
      const label = formatSlotTypeLabel(plan);
      const cls = tierShortClass(plan.tierLine, plan.format) || 'tier-short--team';
      return `<div class="slot-type ${cls}">${escapeHtml(label)}</div>`;
    }

    function slotPlayerInline(row, rosterMap, isWinner) {
      const dn = (row.displayName || '').trim();
      if (!dn) return '';
      const letter = resolvedRaceLetter(row, rosterMap);
      const winCls = isWinner ? 'round-slot-inline-name--win' : '';
      return `<span class="round-slot-inline-name ${winCls}">${racePill(letter)}<span class="truncate max-w-[4.5rem]">${escapeHtml(dn)}</span></span>`;
    }

    function formatRosterInlineSide(rows, rosterMap, winnerTeamIndex, side) {
      const list = (rows || []).filter((r) => (r.displayName || '').trim());
      const isWin =
        winnerTeamIndex === 1 ? side === 'a' : winnerTeamIndex === 2 ? side === 'b' : false;
      const sideCls =
        winnerTeamIndex == null
          ? ''
          : isWin
            ? 'round-slot-compact__side--win'
            : 'round-slot-compact__side--lose';
      if (!list.length) {
        return `<div class="round-slot-compact__side ${sideCls}"><span class="text-zinc-300">—</span></div>`;
      }
      const items = list
        .map((r) => slotPlayerInline(r, rosterMap, isWin))
        .join('<span class="text-zinc-200">·</span>');
      return `<div class="round-slot-compact__side ${sideCls}">${items}</div>`;
    }

    function slotRowMobileCompact(plan, sl, rosterMap) {
      if (!plan) return '';
      const w = sl && sl.winnerTeamIndex;
      const slotNum = plan.slot != null ? plan.slot : '—';
      const mapLabel = plan.map ? escapeHtml(plan.map) : '';
      const decidedCls = w === 1 || w === 2 ? ' round-slot-compact--decided' : '';
      const meta = `<div class="round-slot-compact__meta">
        <div class="slot-num">#${slotNum}</div>
        ${formatSlotTypeMetaHtml(plan)}
        ${mapLabel ? `<div class="truncate max-w-full" title="${mapLabel}">${mapLabel.length > 5 ? mapLabel.slice(0, 5) + '…' : mapLabel}</div>` : ''}
      </div>`;
      const sideA = formatRosterInlineSide(sl?.teamA, rosterMap, w, 'a');
      const sideB = formatRosterInlineSide(sl?.teamB, rosterMap, w, 'b');
      return `<div class="round-slot-compact${decidedCls}">${meta}${sideA}<span class="round-slot-compact__sep">vs</span>${sideB}</div>`;
    }

    function formatChip(format) {
      if (format === '1v1') return '<span class="inline-flex rounded-full bg-sky-100/90 text-sky-800 px-2 py-0.5 text-[10px] font-semibold leading-none ring-1 ring-inset ring-sky-200/60">개인전</span>';
      if (format === '2v2') return '<span class="inline-flex rounded-full bg-fuchsia-50 text-fuchsia-800 px-2 py-0.5 text-[10px] font-semibold leading-none ring-1 ring-inset ring-fuchsia-200/50">2:2</span>';
      if (format === '3v3') return '<span class="inline-flex rounded-full bg-violet-50 text-violet-800 px-2 py-0.5 text-[10px] font-semibold leading-none ring-1 ring-inset ring-violet-200/50">3:3</span>';
      return `<span class="inline-flex rounded-full bg-zinc-100 text-zinc-700 px-2 py-0.5 text-[10px] font-semibold leading-none ring-1 ring-inset ring-zinc-200/70">${escapeHtml(format || '—')}</span>`;
    }

    /** 세트 표시 순: playedOrder 가 있으면 실제 진행 순, 없으면 슬롯 번호 순 */
    function defaultSlotOrder(planBySlot) {
      return [...planBySlot.keys()].sort((a, b) => a - b);
    }

    function isCustomPlayedOrder(playedOrder, planBySlot) {
      const def = defaultSlotOrder(planBySlot);
      if (!Array.isArray(playedOrder) || !playedOrder.length) return false;
      if (playedOrder.length !== def.length) return true;
      for (let i = 0; i < def.length; i++) {
        if (playedOrder[i] !== def[i]) return true;
      }
      return false;
    }

    function slotDisplayOrder(resMu, planBySlot) {
      const def = defaultSlotOrder(planBySlot);
      const po = resMu?.playedOrder;
      if (!Array.isArray(po) || !po.length) return def;
      const ordered = [];
      for (const slotNum of po) {
        if (planBySlot.has(slotNum) && !ordered.includes(slotNum)) ordered.push(slotNum);
      }
      for (const s of def) {
        if (!ordered.includes(s)) ordered.push(s);
      }
      return ordered;
    }

    /** 세트 가운데: 맵·승자 한 덩어리 */
    function slotCenterBlock(plan, w, nameA, nameB, playIndex) {
      if (!plan) return '—';
      const slotNum = plan.slot != null ? plan.slot : '—';
      const playBadge =
        playIndex != null
          ? `<span class="text-zinc-300">·</span><span class="text-indigo-600/85 font-bold tabular-nums">${playIndex}번째</span>`
          : '';
      const top = `<div class="flex flex-wrap items-center justify-center gap-x-1 text-[10px] text-zinc-500 leading-none">
        <span class="font-bold text-indigo-600/90 tabular-nums">#${slotNum}</span>
        <span class="text-zinc-200 select-none">|</span>
        ${formatSlotTypeBadge(plan)}${playBadge}
      </div>`;
      const mapName = plan.map ? escapeHtml(plan.map) : '—';
      const mapEl = `<div class="mt-1 text-[11px] font-semibold text-zinc-700 leading-snug tracking-tight">${mapName}</div>`;
      let winEl = '';
      if (w == null) {
        winEl = '<div class="mt-1 text-[10px] text-zinc-400">미정</div>';
      } else if (w === 1) {
        winEl = `<div class="mt-1 text-[10px] font-medium text-emerald-700 leading-snug truncate max-w-full">${escapeHtml(nameA)}</div>`;
      } else {
        winEl = `<div class="mt-1 text-[10px] font-medium text-emerald-700 leading-snug truncate max-w-full">${escapeHtml(nameB)}</div>`;
      }
      return top + mapEl + winEl;
    }

    function renderMatchupCard(meta, fixMu, planBySlot, resMu, hasRoundDoc, rosterMap) {
      const [tA, tB] = fixMu.teamIds || [];
      const nameA = teamName(meta, tA);
      const nameB = teamName(meta, tB);
      const slotsRes = resMu && resMu.slots ? [...resMu.slots] : [];
      const customPlayOrder = isCustomPlayedOrder(resMu?.playedOrder, planBySlot);
      const [cntA, cntB] = resMu ? countSlotWins(slotsRes) : [0, 0];
      const [dispA, dispB] = resMu ? displayedSetScores(resMu) : [0, 0];
      const sw = resMu && resMu.series && resMu.series.winnerTeamIndex;
      const scoreA = !resMu ? '—' : String(dispA);
      const scoreB = !resMu ? '—' : String(dispB);

      let nameAcls = 'text-indigo-950 font-bold';
      let nameBcls = 'text-indigo-950 font-bold';
      let scoreAcls = 'text-zinc-800';
      let scoreBcls = 'text-zinc-800';
      if (!resMu) {
        nameAcls = nameBcls = 'text-zinc-500 font-semibold';
        scoreAcls = scoreBcls = 'text-zinc-400';
      } else if (sw === 1) {
        nameAcls = 'text-emerald-700 font-extrabold';
        nameBcls = 'text-zinc-500 font-semibold';
        scoreAcls = 'text-emerald-600 font-black';
        scoreBcls = 'text-zinc-400';
      } else if (sw === 2) {
        nameBcls = 'text-emerald-700 font-extrabold';
        nameAcls = 'text-zinc-500 font-semibold';
        scoreBcls = 'text-emerald-600 font-black';
        scoreAcls = 'text-zinc-400';
      } else if (dispA > dispB) {
        nameAcls = 'text-zinc-900 font-extrabold';
        nameBcls = 'text-zinc-500 font-medium';
        scoreAcls = 'text-emerald-600 font-black';
        scoreBcls = 'text-zinc-500';
      } else if (dispB > dispA) {
        nameBcls = 'text-zinc-900 font-extrabold';
        nameAcls = 'text-zinc-500 font-medium';
        scoreBcls = 'text-emerald-600 font-black';
        scoreAcls = 'text-zinc-500';
      }

      const teamAHtml = formatTeamMatchupHeader(meta, tA, 'end', nameAcls);
      const teamBHtml = formatTeamMatchupHeader(meta, tB, 'start', nameBcls);
      const teamAMobileHtml = formatTeamMatchupHeader(meta, tA, 'start', nameAcls);
      const teamBMobileHtml = formatTeamMatchupHeader(meta, tB, 'start', nameBcls);
      const mvpHtml = formatMvpBadge(resMu, rosterMap);

      let seriesNote = '';
      if (sw === 1 || sw === 2) {
        seriesNote = '';
      } else if (resMu && (cntA > 0 || cntB > 0)) {
        seriesNote = '<span class="text-[10px] text-amber-700/90">시리즈 승 미기재</span>';
      } else if (!hasRoundDoc) {
        seriesNote = '';
      } else if (!resMu) {
        seriesNote = '<span class="text-[10px] font-medium text-amber-800">대전 미입력</span>';
      } else {
        seriesNote = '<span class="text-[10px] text-zinc-400">결과 대기</span>';
      }
      const showMetaRow = Boolean(seriesNote) || customPlayOrder;
      const playOrderNote = customPlayOrder
        ? '<span class="text-[10px] font-medium text-indigo-700/90">세트 표시 · 실제 진행 순</span>'
        : '';

      const order = slotDisplayOrder(resMu, planBySlot);
      const orderedPlans = order.map((slot) => planBySlot.get(slot)).filter(Boolean);
      const slotRows = [];
      const slotRowsMobile = [];
      for (let pi = 0; pi < orderedPlans.length; pi++) {
        const plan = orderedPlans[pi];
        const sl = resMu && slotsRes.find((x) => x.slot === plan.slot);
        const w = sl && sl.winnerTeamIndex;
        const playIndex = customPlayOrder ? pi + 1 : null;
        const t1Win = w === 1 ? 'bg-emerald-50/90 sm:border-r-[4px] sm:border-r-emerald-500' : 'bg-zinc-50/40';
        const t2Win = w === 2 ? 'bg-emerald-50/90 sm:border-l-[4px] sm:border-l-emerald-500' : 'bg-zinc-50/40';
        const centerHtml = slotCenterBlock(plan, w, nameA, nameB, playIndex);
        slotRowsMobile.push(slotRowMobileCompact(plan, sl, rosterMap));
        slotRows.push(`
          <div class="hidden sm:grid sm:grid-cols-12 gap-0 items-stretch rounded-xl border border-zinc-200/50 bg-white shadow-sm overflow-hidden ring-1 ring-zinc-900/[0.03]">
            <div class="order-1 sm:order-2 sm:col-span-2 px-2 py-2.5 flex flex-col items-center justify-center bg-zinc-50/90 border-b sm:border-b-0 sm:border-x border-zinc-100/90 text-center min-w-0">
              ${centerHtml}
            </div>
            <div class="order-2 sm:order-1 sm:col-span-5 px-3 py-2.5 text-center sm:text-right ${t1Win} border-b sm:border-b-0 sm:border-r border-zinc-100">
              <div class="hidden sm:block w-full">${formatRoster(sl ? sl.teamA : null, rosterMap, 'end')}</div>
            </div>
            <div class="order-3 sm:order-3 sm:col-span-5 px-3 py-2.5 text-center sm:text-left ${t2Win}">
              <div class="hidden sm:block w-full">${formatRoster(sl ? sl.teamB : null, rosterMap, 'start')}</div>
            </div>
          </div>`);
      }

      return `
        <article class="rounded-2xl border border-zinc-200/60 bg-white shadow-sm shadow-zinc-900/5 overflow-hidden mb-4 ring-1 ring-zinc-900/[0.04]" title="${escapeHtml(fixMu.id)}">
          <div class="px-3 py-2.5 sm:px-5 sm:py-4 bg-gradient-to-b from-zinc-50/80 to-white border-b border-zinc-100/90">
            <div class="sm:hidden">
              <div class="flex flex-col items-center mb-2">
                <div class="text-xl font-black tabular-nums leading-none tracking-tight text-zinc-900">
                  <span class="${scoreAcls}">${escapeHtml(scoreA)}</span><span class="text-zinc-300 mx-0.5 font-light">:</span><span class="${scoreBcls}">${escapeHtml(scoreB)}</span>
                </div>
                <div class="text-[9px] text-zinc-400 mt-1 font-medium tracking-wide">세트</div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div class="min-w-0">${teamAMobileHtml}</div>
                <div class="min-w-0">${teamBMobileHtml}</div>
              </div>
            </div>
            <div class="hidden sm:grid sm:grid-cols-[1fr_auto_1fr] sm:items-center sm:gap-6">
              <div class="text-right min-w-0">
                ${teamAHtml}
              </div>
              <div class="flex flex-col items-center shrink-0 px-1">
                <div class="text-3xl font-black tabular-nums leading-none tracking-tight text-zinc-900">
                  <span class="${scoreAcls}">${escapeHtml(scoreA)}</span><span class="text-zinc-300 mx-1 font-light">:</span><span class="${scoreBcls}">${escapeHtml(scoreB)}</span>
                </div>
                <div class="text-[10px] text-zinc-400 mt-1.5 font-medium tracking-wide">세트</div>
              </div>
              <div class="text-left min-w-0">
                ${teamBHtml}
              </div>
            </div>
          </div>
          ${mvpHtml}
          ${showMetaRow ? `<div class="px-3 py-1 border-b border-zinc-100 bg-amber-50/40 text-right text-[10px] flex flex-wrap justify-end gap-x-2 gap-y-0.5">${playOrderNote}${seriesNote}</div>` : ''}
          <div class="p-1.5 sm:p-2.5 space-y-2">
            <div class="round-slots-mobile-wrap sm:hidden">${slotRowsMobile.join('')}</div>
            <div class="hidden sm:block space-y-2">${slotRows.join('')}</div>
          </div>
        </article>`;
    }

    function renderRoundPane(meta, fr, doc, isFirst, rosterMap, fixtures) {
      const planBySlot = slotPlanBySlot(fr);
      const metaLine = '';

      const cards = sortMatchupsForDisplay(fr.matchups, fr.round, fixtures)
        .map((m) => {
          const resMu = resultMatchupByFixtureId(doc, m.id);
          return renderMatchupCard(meta, m, planBySlot, resMu, !!doc, rosterMap);
        })
        .join('');

      return `
        <section class="round-pane ${isFirst ? '' : 'hidden'}" id="round-pane-${fr.round}" data-round="${fr.round}" data-loaded="1">
          <h2 class="text-lg font-semibold text-zinc-900 mb-0.5 tracking-tight">${fr.round}라운드</h2>
          ${metaLine}
          ${cards || '<p class="text-zinc-400 text-sm">대전 정보가 없습니다.</p>'}
        </section>`;
    }

    function renderRoundPanePlaceholder(fr, isFirst) {
      return `
        <section class="round-pane ${isFirst ? '' : 'hidden'}" id="round-pane-${fr.round}" data-round="${fr.round}" data-loaded="0">
          <h2 class="text-lg font-semibold text-zinc-900 mb-0.5 tracking-tight">${fr.round}라운드</h2>
          <p class="text-zinc-400 text-sm py-6 text-center">불러오는 중…</p>
        </section>`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const loading = document.getElementById('loading');
      const main = document.getElementById('main');
      const tabsEl = document.getElementById('roundTabs');
      const panesEl = document.getElementById('roundPanes');

      try {
        const [meta, fixtures, playersData] = await Promise.all([
          loadJson('data/s11/meta.json'),
          loadJson('data/s11/fixtures.json'),
          loadJson('data/s11/players.json'),
        ]);
        const rosterMap = rosterByDisplayName(playersData.players || []);
        const allRounds = [...(fixtures.rounds || [])].sort((a, b) => (a.round || 0) - (b.round || 0));
        if (!allRounds.length) throw new Error('fixtures.json에 rounds가 없습니다.');

        const manifest = await loadResultsManifest();
        const loadingRounds = new Set();
        const appState = {
          activeHalf: defaultHalfKey(fixtures, meta),
          activeRound: null,
          halfRounds: [],
        };

        function updateHalfTabs() {
          document.querySelectorAll('[data-rounds-half]').forEach((btn) => {
            const on = btn.dataset.roundsHalf === appState.activeHalf;
            btn.classList.toggle('is-active', on);
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
          });
        }

        async function ensureRoundPane(roundNum) {
          const pane = panesEl.querySelector(`#round-pane-${roundNum}`);
          if (!pane || pane.dataset.loaded === '1') return;
          if (loadingRounds.has(roundNum)) return;
          loadingRounds.add(roundNum);
          try {
            const fr = allRounds.find((x) => x.round === roundNum);
            const doc = await loadSingleRoundDoc(fixtures, roundNum);
            const isVisible = !pane.classList.contains('hidden');
            const html = renderRoundPane(meta, fr, doc, isVisible, rosterMap, fixtures);
            const wrap = document.createElement('div');
            wrap.innerHTML = html.trim();
            const newPane = wrap.firstElementChild;
            if (!isVisible) newPane.classList.add('hidden');
            pane.replaceWith(newPane);
          } finally {
            loadingRounds.delete(roundNum);
          }
        }

        function wireRoundTabs() {
          tabsEl.querySelectorAll('.sub-tab').forEach((tab) => {
            tab.addEventListener('click', async () => {
              const r = Number(tab.dataset.round);
              if (!Number.isFinite(r) || r === appState.activeRound) return;
              appState.activeRound = r;
              tabsEl.querySelectorAll('.sub-tab').forEach((t) => t.classList.remove('active'));
              panesEl.querySelectorAll('.round-pane').forEach((p) => p.classList.add('hidden'));
              tab.classList.add('active');
              await ensureRoundPane(r);
              const pane = panesEl.querySelector(`#round-pane-${r}`);
              if (pane) pane.classList.remove('hidden');
            });
          });
        }

        async function renderHalfView(preferRound) {
          appState.halfRounds = roundsInHalf(allRounds, appState.activeHalf);
          const range = HALF_RANGES[appState.activeHalf] || HALF_RANGES.second_half;

          if (!appState.halfRounds.length) {
            tabsEl.className = 'mb-5 flex flex-wrap gap-1 p-1 rounded-xl bg-zinc-200/35 border border-zinc-200/60';
            tabsEl.innerHTML = '';
            panesEl.innerHTML = `<p class="text-sm text-zinc-500 py-6 text-center">${escapeHtml(range.label)} 라운드 일정이 없습니다.</p>`;
            appState.activeRound = null;
            return;
          }

          const nums = appState.halfRounds.map((r) => r.round);
          let initialRound =
            preferRound != null && nums.includes(preferRound)
              ? preferRound
              : pickInitialRoundForHalf(appState.halfRounds, manifest);
          if (initialRound == null) initialRound = appState.halfRounds[0].round;
          appState.activeRound = initialRound;

          tabsEl.className = 'mb-5 flex flex-wrap gap-1 p-1 rounded-xl bg-zinc-200/35 border border-zinc-200/60';
          tabsEl.innerHTML = appState.halfRounds
            .map((r) => {
              const active = r.round === initialRound ? 'active' : '';
              return `<button type="button" data-round="${r.round}" class="sub-tab py-2 px-3.5 text-sm rounded-lg ${active}">${r.round}라운드</button>`;
            })
            .join('');

          const initialDoc = await loadSingleRoundDoc(fixtures, initialRound);
          panesEl.innerHTML = appState.halfRounds
            .map((fr) => {
              if (fr.round === initialRound) {
                return renderRoundPane(meta, fr, initialDoc, true, rosterMap, fixtures);
              }
              return renderRoundPanePlaceholder(fr, false);
            })
            .join('');

          wireRoundTabs();
          const activeTab = tabsEl.querySelector('.sub-tab.active');
          if (activeTab && typeof activeTab.scrollIntoView === 'function') {
            activeTab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'auto' });
          }
        }

        document.querySelectorAll('[data-rounds-half]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const half = btn.dataset.roundsHalf;
            if (!half || half === appState.activeHalf) return;
            appState.activeHalf = half;
            updateHalfTabs();
            await renderHalfView(null);
          });
        });

        // 하반기 시즌이면 하반기 탭 기본. 상반기 시즌이면 최신 결과가 있는 반기.
        const latestAny = latestResultRoundFromManifest(
          manifest,
          allRounds.map((r) => r.round),
        );
        const phaseDefault = defaultHalfKey(fixtures, meta);
        if (phaseDefault === 'second_half') {
          appState.activeHalf = 'second_half';
        } else if (latestAny != null) {
          appState.activeHalf = latestAny >= 11 ? 'second_half' : 'first_half';
        } else {
          appState.activeHalf = phaseDefault;
        }
        updateHalfTabs();

        // 최신 결과가 현재 반기에 있으면 그 라운드, 없으면 해당 반기 기본 라운드
        let prefer = null;
        if (latestAny != null) {
          const halfOfLatest = latestAny >= 11 ? 'second_half' : 'first_half';
          if (halfOfLatest === appState.activeHalf) prefer = latestAny;
        }
        await renderHalfView(prefer);

        loading.classList.add('hidden');
        main.classList.remove('hidden');
      } catch (e) {
        console.error(e);
        loading.innerHTML = `<p class="text-red-600 font-medium">${escapeHtml(e.message)}</p>`;
      }
    });
  </script>
</body>
</html>
