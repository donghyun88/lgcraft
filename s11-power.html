<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>멸망전 시즌11 · 팀 전력</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="s11-site-header.css" />
  <style>
    body { font-family: Inter, sans-serif; }
    .power-form-dot {
      display: inline-flex;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 0.25rem;
      font-size: 0.5625rem;
      font-weight: 800;
      align-items: center;
      justify-content: center;
    }
    .power-form-w { background: #d1fae5; color: #047857; }
    .power-form-l { background: #fee2e2; color: #b91c1c; }
    .power-section-label {
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #71717a;
      margin-bottom: 0.5rem;
    }
    .last-match-board {
      border: 1px solid #e4e4e7;
      border-radius: 0.75rem;
      background: #fafafa;
      overflow: hidden;
    }
    .last-match-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.625rem 0.875rem;
      background: linear-gradient(to right, #f8fafc, #eef2ff);
      border-bottom: 1px solid #e4e4e7;
    }
    .last-match-score {
      font-size: 1.125rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .last-match-score.w { color: #047857; }
    .last-match-score.l { color: #b91c1c; }
    .last-match-set {
      display: grid;
      grid-template-columns: 2.75rem minmax(0, 1fr) auto;
      gap: 0.35rem 0.5rem;
      align-items: center;
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #f4f4f5;
      font-size: 0.75rem;
    }
    .last-match-set:last-child { border-bottom: none; }
    .last-match-set.won { background: #f0fdf4; }
    .last-match-set.lost { background: #fef2f2; }
    .last-match-slot {
      font-size: 0.625rem;
      font-weight: 800;
      color: #71717a;
      text-transform: uppercase;
    }
    .last-match-names { color: #3f3f46; line-height: 1.35; min-width: 0; }
    .last-match-names strong { color: #18181b; font-weight: 700; }
    .last-match-wl {
      font-size: 0.625rem;
      font-weight: 900;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      letter-spacing: 0.04em;
    }
    .last-match-wl.w { background: #d1fae5; color: #047857; }
    .last-match-wl.l { background: #fee2e2; color: #b91c1c; }
    .last-match-takeaway {
      padding: 0.625rem 0.875rem;
      font-size: 0.75rem;
      line-height: 1.5;
      color: #52525b;
      border-top: 1px solid #e4e4e7;
      background: #fff;
    }
    .roster-special-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.625rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #6d28d9;
      background: #ede9fe;
      border: 1px solid #ddd6fe;
      border-radius: 9999px;
      padding: 0.125rem 0.5rem;
    }
    .tpi-ovr-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 5.5rem;
      height: 5.5rem;
      border-radius: 9999px;
      border: 3px solid #c4b5fd;
      background: linear-gradient(145deg, #faf5ff, #fff);
      flex-shrink: 0;
    }
    .tpi-ovr-num {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #5b21b6;
    }
    .tpi-ovr-label {
      font-size: 0.5625rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-top: 0.125rem;
    }
    .tpi-sub-card {
      border: 1px solid #e4e4e7;
      border-radius: 0.5rem;
      background: #fafafa;
      padding: 0.5rem 0.625rem;
      text-align: center;
    }
    .tpi-sub-val {
      font-size: 1.125rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #27272a;
    }
    .tpi-sub-label {
      font-size: 0.625rem;
      font-weight: 700;
      color: #71717a;
      margin-top: 0.125rem;
    }
    .tpi-tier-row {
      display: grid;
      grid-template-columns: 2.5rem 1fr minmax(5.75rem, auto);
      gap: 0.375rem 0.5rem;
      align-items: center;
    }
    .tpi-tier-label {
      font-size: 0.6875rem;
      font-weight: 700;
      color: #52525b;
    }
    .tpi-tier-track {
      height: 0.5rem;
      border-radius: 9999px;
      background: #e4e4e7;
      overflow: hidden;
    }
    .tpi-tier-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.4s ease;
    }
    .tpi-tier-score {
      font-size: 0.6875rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: #3f3f46;
    }
    .tpi-heat-cell {
      font-size: 0.6875rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      border-radius: 0.375rem;
      padding: 0.375rem 0.25rem;
      color: #18181b;
    }
    .tpi-radar-box {
      width: 100%;
      max-width: 11rem;
      height: 11rem;
      margin: 0 auto;
    }
    .tpi-league-chart-box {
      height: 220px;
      position: relative;
    }
    @media (min-width: 640px) {
      .tpi-league-chart-box { height: 240px; }
    }
    .tpi-grade {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.625rem;
      height: 1.375rem;
      padding: 0 0.3rem;
      border-radius: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      flex-shrink: 0;
    }
    .tpi-grade-lg {
      min-width: 2.75rem;
      height: 2.75rem;
      font-size: 1.25rem;
      border-radius: 0.625rem;
      border-width: 2px;
    }
    .tpi-axis-meta {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tpi-delta-up { color: #059669; font-weight: 800; font-size: 0.625rem; }
    .tpi-delta-down { color: #dc2626; font-weight: 800; font-size: 0.625rem; }
    .tpi-delta-flat { color: #71717a; font-weight: 700; font-size: 0.625rem; }
    .tpi-rank-pill {
      font-size: 0.5625rem;
      font-weight: 800;
      color: #52525b;
      background: #f4f4f5;
      border-radius: 9999px;
      padding: 0.1rem 0.4rem;
      white-space: nowrap;
    }
    .tpi-spotlight {
      border: 1px solid #e9d5ff;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #faf5ff, #fff);
      padding: 0.5rem 0.625rem;
    }
    .tpi-spotlight-label {
      font-size: 0.5625rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #7c3aed;
    }
    .tpi-spotlight-name {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #18181b;
      margin-top: 0.125rem;
    }
    .tpi-spotlight-detail {
      font-size: 0.625rem;
      color: #71717a;
      margin-top: 0.125rem;
    }
    .tpi-hof-card {
      border: 1px solid #e4e4e7;
      border-radius: 0.625rem;
      padding: 0.625rem 0.75rem;
      background: #fff;
    }
    .tpi-hof-axis {
      font-size: 0.625rem;
      font-weight: 800;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tpi-hof-team {
      font-size: 0.875rem;
      font-weight: 800;
      color: #18181b;
      margin-top: 0.125rem;
    }
    .tpi-tagline {
      font-size: 0.75rem;
      font-weight: 600;
      color: #5b21b6;
      line-height: 1.45;
      margin-top: 0.5rem;
      padding: 0.5rem 0.625rem;
      background: #f5f3ff;
      border-radius: 0.5rem;
      border-left: 3px solid #8b5cf6;
    }
    .tpi-podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .tpi-podium-item {
      text-align: center;
      border-radius: 0.625rem;
      padding: 0.625rem 0.5rem;
      border: 1px solid #e4e4e7;
    }
    .tpi-podium-item--1 { background: linear-gradient(180deg, #fef3c7, #fff); border-color: #fcd34d; }
    .tpi-podium-item--2 { background: linear-gradient(180deg, #f4f4f5, #fff); }
    .tpi-podium-item--3 { background: linear-gradient(180deg, #ffedd5, #fff); border-color: #fdba74; }
    .buzz-half {
      border: 1px solid #e4e4e7;
      border-radius: 0.75rem;
      padding: 0.75rem;
      background: #fff;
    }
    .buzz-half--first { border-top: 3px solid #6366f1; }
    .buzz-half--second { border-top: 3px solid #f59e0b; }
    .buzz-pick {
      border: 1px solid #f4f4f5;
      border-radius: 0.5rem;
      padding: 0.5rem 0.625rem;
      background: #fafafa;
    }
    .buzz-pick-tag {
      font-size: 0.5625rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #7c3aed;
    }
    .buzz-pick-name {
      font-size: 0.875rem;
      font-weight: 800;
      color: #18181b;
      margin-top: 0.125rem;
    }
    .buzz-pick-meta {
      font-size: 0.625rem;
      color: #71717a;
      margin-top: 0.125rem;
    }
    .buzz-pick-hook {
      font-size: 0.6875rem;
      color: #52525b;
      margin-top: 0.25rem;
      line-height: 1.4;
    }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="feb79bac-7105-44c9-a5ce-142957ac05b9"></script>
</head>
<body class="bg-zinc-100 text-zinc-800 min-h-screen text-sm antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="s11-site-header" role="banner">
      <div class="s11-site-header-accent" aria-hidden="true"></div>
      <div class="s11-site-header-panel">
        <div class="s11-site-header-body">
          <div class="s11-site-header-top">
            <div class="s11-site-header-brand">
              <div class="lg-craft-lockup lg-craft-lockup--hero" title="LG Craft">
                <img src="LG_symbol.svg.png" alt="" class="lg-craft-hero-img mx-auto w-auto max-w-full object-contain" decoding="async" />
                <div class="lg-craft-wordmark" lang="en"><span class="lg-red">LG</span> Craft</div>
              </div>
            </div>
            <div class="s11-site-header-series" aria-label="멸망전 시즌 11">
              <span class="s11-site-header-series-ko" lang="ko">멸망전</span>
              <span class="s11-site-header-series-en" lang="en">Season 11</span>
            </div>
          </div>
          <h1 class="s11-site-header-page-title">팀 전력</h1>
        </div>
      </div>
    </header>

    <nav class="s11-site-nav mb-8 border-b border-zinc-200 pb-3" aria-label="시즌11">
      <a href="index.html" class="s11-site-nav-link">팀 순위</a>
      <a href="s11-schedule.html" class="s11-site-nav-link">경기 일정</a>
      <a href="s11-roster.html" class="s11-site-nav-link">로스터</a>
      <a href="s11-rounds.html" class="s11-site-nav-link">라운드 결과</a>
      <a href="s11-players.html" class="s11-site-nav-link">선수 기록</a>
      <a href="s11-stats.html" class="s11-site-nav-link">통계 차트</a>
      <span class="s11-site-nav-current">팀 전력</span>
    </nav>

    <p id="load-err" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 mb-4"></p>

    <div id="loading" class="rounded-xl border border-zinc-200 bg-white p-12 text-center text-zinc-500 shadow-sm">
      <p class="font-medium text-zinc-700">불러오는 중…</p>
    </div>

    <main id="main-content" class="hidden space-y-5 pb-8">
      <div class="rounded-xl border border-zinc-200 bg-white p-4 sm:p-5 shadow-sm">
        <p id="power-subtitle" class="text-sm text-zinc-600"></p>
        <p id="power-disclaimer" class="mt-1.5 text-xs text-zinc-400"></p>
      </div>
      <div id="special-banner" class="hidden rounded-xl border border-violet-200 bg-gradient-to-r from-violet-50 to-indigo-50 p-4 sm:p-5 shadow-sm">
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <span class="roster-special-badge">특별편</span>
          <h2 id="special-title" class="text-sm font-bold text-violet-900"></h2>
        </div>
        <p id="special-intro" class="text-[13px] leading-relaxed text-violet-900/80"></p>
        <p id="special-method" class="hidden mt-2 text-[11px] leading-relaxed text-violet-800/60 border-t border-violet-200/60 pt-2"></p>
      </div>
      <div id="league-power-index" class="hidden rounded-xl border border-violet-200 bg-white p-4 sm:p-5 shadow-sm space-y-4"></div>
      <div id="power-grid" class="space-y-4"></div>
    </main>
  </div>

  <script type="module">
    import { loadAllSeasonRoundDocs } from './js/s11-data-loader.mjs';
    import { simulateSeason } from './js/s11-season-simulate.mjs';
    import {
      TIER_ORDER,
      RADAR_AXES,
      TIER_BAR_COLORS,
      TEAM_CHART_COLORS,
      GRADE_COLORS,
      computeLeaguePowerRatings,
    } from './js/s11-team-power-ratings.mjs';
    import { computeHalfSeasonBuzz, BUZZ_CRITERIA_TEXT } from './js/s11-buzz-players.mjs';

    const chartInstances = [];

    function destroyCharts() {
      while (chartInstances.length) {
        const c = chartInstances.pop();
        try {
          c.destroy();
        } catch (_) {
          /* ignore */
        }
      }
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formHtml(form) {
      if (!form?.length) return '';
      return form
        .map((c) => {
          const cls = c === 'W' ? 'power-form-w' : 'power-form-l';
          return `<span class="power-form-dot ${cls}" title="${c === 'W' ? '승' : '패'}">${c}</span>`;
        })
        .join('');
    }

    function listHtml(items, tone) {
      const bullet = tone === 'up' ? 'text-emerald-600' : 'text-rose-500';
      return `<ul class="space-y-1.5">${(items || [])
        .map(
          (t) =>
            `<li class="flex gap-2 text-[13px] leading-snug text-zinc-700"><span class="${bullet} font-bold shrink-0">·</span><span>${escapeHtml(t)}</span></li>`,
        )
        .join('')}</ul>`;
    }

    function gradeBadgeHtml(grade, large = false) {
      const g = GRADE_COLORS[grade] || GRADE_COLORS.C;
      const cls = large ? 'tpi-grade tpi-grade-lg' : 'tpi-grade';
      return `<span class="${cls}" style="background:${g.bg};color:${g.text};border-color:${g.border}">${escapeHtml(grade || '—')}</span>`;
    }

    function deltaHtml(delta) {
      if (delta == null || delta === 0) return `<span class="tpi-delta-flat">±0</span>`;
      if (delta > 0) return `<span class="tpi-delta-up">+${delta}</span>`;
      return `<span class="tpi-delta-down">${delta}</span>`;
    }

    function rankBarPct(rank, total = 6) {
      if (!rank) return 20;
      return Math.round(((total + 1 - rank) / total) * 100);
    }

    function renderAxisRow(axis, rating, color) {
      const rank = rating.axisRanks?.[axis] ?? 6;
      const grade = rating.axisGrades?.[axis] ?? 'D';
      const delta = rating.axisDelta?.[axis] ?? 0;
      const pct = rankBarPct(rank);
      const isTeamAxis = axis === '팀전';
      const top = !isTeamAxis ? rating.tiers?.[axis]?.top : null;
      const topPpi = top?.ppiTier ?? top?.ppiSolo;
      const topHint = top?.displayName
        ? ` · ${top.displayName}${topPpi != null ? ` (${topPpi})` : ''}`
        : '';
      const blendHint = isTeamAxis ? '' : ' · 개인7 팀3';
      const ts = rating.teamSlot;
      const teamHint = isTeamAxis && ts?.games ? ` · ${ts.wins}승 ${ts.losses}패` : '';

      return `<div class="tpi-tier-row" title="${escapeHtml(axis)} 리그 ${rank}위${blendHint}${topHint}${teamHint}">
        <span class="tpi-tier-label">${escapeHtml(axis)}</span>
        <div class="tpi-tier-track"><div class="tpi-tier-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="tpi-axis-meta">
          ${gradeBadgeHtml(grade)}
          <span class="tpi-rank-pill">${rank}위</span>
          ${deltaHtml(delta)}
        </div>
      </div>`;
    }

    function renderSpotlights(spotlights) {
      if (!spotlights?.length) return '';
      return `<div>
        <div class="text-[10px] font-bold text-violet-700/80 mb-1.5">이 팀의 볼거리</div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        ${spotlights
          .map(
            (s) => `<div class="tpi-spotlight">
              <div class="tpi-spotlight-label">${escapeHtml(s.label)}</div>
              <div class="tpi-spotlight-name">${escapeHtml(s.name)}</div>
              <div class="tpi-spotlight-detail">${escapeHtml(s.detail)}</div>
            </div>`,
          )
          .join('')}
        </div>
      </div>`;
    }

    function renderBuzzHalf(half, modClass) {
      if (!half?.picks?.length) {
        return `<div class="buzz-half ${modClass}">
          <div class="text-xs font-bold text-zinc-800">${escapeHtml(half?.label || '')} <span class="font-normal text-zinc-400">${escapeHtml(half?.roundLabel || '')}</span></div>
          <p class="text-[11px] text-zinc-400 mt-2">집계할 결과가 없습니다.</p>
        </div>`;
      }
      return `<div class="buzz-half ${modClass}">
        <div class="flex items-baseline justify-between gap-2 mb-2">
          <h4 class="text-xs font-bold text-zinc-900">${escapeHtml(half.label)} 화제의 선수</h4>
          <span class="text-[10px] font-medium text-zinc-400">${escapeHtml(half.roundLabel)}</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          ${half.picks
            .map(
              (p) => `<div class="buzz-pick">
                <div class="buzz-pick-tag">${escapeHtml(p.tag)}</div>
                <div class="buzz-pick-name">${escapeHtml(p.displayName)}</div>
                <div class="buzz-pick-meta">${escapeHtml(p.teamName || '')} · ${escapeHtml(p.tier || '')}</div>
                <div class="buzz-pick-hook">${escapeHtml(p.hook || '')}</div>
              </div>`,
            )
            .join('')}
        </div>
      </div>`;
    }

    function renderBuzzSection(buzz) {
      if (!buzz) return '';
      const criteria = buzz.criteria || BUZZ_CRITERIA_TEXT;
      return `<div class="space-y-3">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h3 class="text-sm font-bold text-zinc-900">시즌 화제의 선수</h3>
          <span class="text-[10px] text-zinc-400">활약 기준 · 합류만으론 선정 안 됨</span>
        </div>
        <p class="text-[11px] leading-relaxed text-zinc-500 rounded-lg bg-zinc-50 border border-zinc-100 px-3 py-2">${escapeHtml(criteria)}</p>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          ${renderBuzzHalf(buzz.firstHalf, 'buzz-half--first')}
          ${renderBuzzHalf(buzz.secondHalf, 'buzz-half--second')}
        </div>
      </div>`;
    }

    function renderPodium(teams, ratingsByTeam) {
      const top3 = [...teams]
        .map((t) => ({ ...t, rating: ratingsByTeam[t.teamId] }))
        .filter((t) => t.rating)
        .sort((a, b) => (a.rating.leagueRank || 99) - (b.rating.leagueRank || 99))
        .slice(0, 3);
      const order = [top3[1], top3[0], top3[2]].filter(Boolean);
      const medals = ['2nd', '1st', '3rd'];
      return `<div class="tpi-podium">
        ${order
          .map((t, i) => {
            const place = t.rating.leagueRank;
            const mod = place === 1 ? '--1' : place === 2 ? '--2' : '--3';
            return `<div class="tpi-podium-item tpi-podium-item${mod}">
              <div class="text-[10px] font-bold text-zinc-500 mb-1">${medals[i]}</div>
              ${gradeBadgeHtml(t.rating.overallGrade, true)}
              <div class="text-xs font-bold text-zinc-900 mt-1.5">${escapeHtml(t.short || t.name)}</div>
              <div class="text-[10px] text-zinc-500 tabular-nums">종합 ${t.rating.leagueRank}위</div>
            </div>`;
          })
          .join('')}
      </div>`;
    }

    function renderHallOfFame(hall, teams) {
      if (!hall?.length) return '';
      const nameById = new Map(teams.map((t) => [t.teamId, t.name]));
      return `<div>
        <h4 class="text-xs font-bold text-zinc-700 mb-2">라인별 리그 1위 · 명예의 전당</h4>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          ${hall
            .map((h) => {
              const teamName = nameById.get(h.teamId) || h.teamId;
              const color = TEAM_CHART_COLORS[h.teamId] || '#6366f1';
              return `<div class="tpi-hof-card" style="border-left: 3px solid ${color}">
                <div class="tpi-hof-axis">${escapeHtml(h.axis)}</div>
                <div class="flex items-center gap-2 mt-1">
                  ${gradeBadgeHtml('S')}
                  <span class="tpi-hof-team">${escapeHtml(teamName)}</span>
                </div>
              </div>`;
            })
            .join('')}
        </div>
      </div>`;
    }

    function renderTierBars(rating) {
      const tierRows = TIER_ORDER.map((tier) =>
        renderAxisRow(tier, rating, TIER_BAR_COLORS[tier] || '#71717a'),
      ).join('');
      const teamRow = renderAxisRow('팀전', rating, TIER_BAR_COLORS.팀전 || '#0d9488');
      return `<div class="space-y-1.5">${tierRows}<div class="border-t border-teal-100 pt-1">${teamRow}</div></div>`;
    }

    function renderTeamPowerIndexSection(teamId, rating) {
      if (!rating) return '';
      return `<section class="rounded-lg border border-violet-200 bg-gradient-to-br from-violet-50/80 to-white px-3.5 py-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="power-section-label !mb-0 !text-violet-700">TPI 리그 순위표</div>
          <span class="text-[10px] text-zinc-400">티어=개인7·팀3 · 팀전=별도 슬롯</span>
        </div>
        ${rating.tagline ? `<p class="tpi-tagline">${escapeHtml(rating.tagline)}</p>` : ''}
        <div class="grid grid-cols-1 lg:grid-cols-[auto_1fr_11rem] gap-4 items-center mt-3">
          <div class="flex items-center gap-3">
            <div class="flex flex-col items-center gap-1">
              ${gradeBadgeHtml(rating.overallGrade, true)}
              <span class="text-[10px] font-bold text-violet-800">종합 ${rating.leagueRank ?? '—'}위</span>
            </div>
            <div class="text-[11px] text-violet-800/70 leading-snug">
              <p class="font-bold text-violet-900 tabular-nums">TPI ${rating.ovr}</p>
              <p class="mt-0.5">개인 ${rating.tierOvr ?? rating.attack} · 팀전 ${rating.teamBattle}</p>
              <p>출전 ${rating.activePlayers}/${rating.rosterSize}명</p>
            </div>
          </div>
          <div class="min-w-0">${renderTierBars(rating)}</div>
          <div class="tpi-radar-box"><canvas id="chart-radar-${escapeHtml(teamId)}" aria-label="티어별 리그 순위 레이더"></canvas></div>
        </div>
        ${renderSpotlights(rating.spotlights)}
      </section>`;
    }

    function renderLeaguePowerSection(teams, ratingsByTeam, buzz) {
      const hall = ratingsByTeam._hallOfFame || [];
      const sorted = [...teams]
        .map((t) => ({ ...t, rating: ratingsByTeam[t.teamId] }))
        .filter((t) => t.rating)
        .sort((a, b) => (a.rating.leagueRank || 99) - (b.rating.leagueRank || 99));

      const heatRows = sorted
        .map((t) => {
          const teamGrade = t.rating.axisGrades?.팀전 ?? 'D';
          const teamRank = t.rating.axisRanks?.팀전 ?? 6;
          const teamG = GRADE_COLORS[teamGrade] || GRADE_COLORS.C;
          const cells = TIER_ORDER.map((tier) => {
            const grade = t.rating.axisGrades?.[tier] ?? 'D';
            const rank = t.rating.axisRanks?.[tier] ?? 6;
            const g = GRADE_COLORS[grade] || GRADE_COLORS.C;
            return `<td class="tpi-heat-cell" style="background:${g.bg};color:${g.text};border:1px solid ${g.border}">
              <div class="text-sm font-black leading-none">${escapeHtml(grade)}</div>
              <div class="text-[9px] font-bold opacity-80 mt-0.5">${rank}위</div>
            </td>`;
          }).join('');
          return `<tr>
            <td class="py-2 pr-2 text-[12px] font-semibold text-zinc-800 whitespace-nowrap">${escapeHtml(t.name)}</td>
            <td class="py-2 px-1 text-center">
              ${gradeBadgeHtml(t.rating.overallGrade)}
              <div class="text-[9px] font-bold text-violet-700 tabular-nums mt-0.5">${t.rating.leagueRank}위</div>
            </td>
            ${cells}
            <td class="tpi-heat-cell" style="background:${teamG.bg};color:${teamG.text};border:1px solid ${teamG.border}">
              <div class="text-sm font-black leading-none">${escapeHtml(teamGrade)}</div>
              <div class="text-[9px] font-bold opacity-80 mt-0.5">${teamRank}위</div>
            </td>
          </tr>`;
        })
        .join('');

      const tierHeaders = TIER_ORDER.map(
        (tier) =>
          `<th class="pb-2 text-[10px] font-bold text-zinc-500 text-center">${escapeHtml(tier)}</th>`,
      ).join('');

      return `<div>
        ${renderBuzzSection(buzz)}
        <div class="mt-5 pt-5 border-t border-zinc-100">
        <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
          <h3 class="text-sm font-bold text-violet-900">리그 TPI · 등급 순위표</h3>
          <span class="text-[10px] text-zinc-400">S=1위 … D=6위 · 6팀 기준</span>
        </div>
        ${renderPodium(teams, ratingsByTeam)}
        ${renderHallOfFame(hall, teams)}
        <div class="tpi-league-chart-box mb-4 mt-4"><canvas id="chart-league-ovr" aria-label="팀별 종합 순위"></canvas></div>
        <div class="overflow-x-auto -mx-1 px-1 mt-4">
          <table class="w-full min-w-[560px] border-collapse">
            <thead>
              <tr class="border-b border-zinc-100">
                <th class="pb-2 text-left text-[10px] font-bold text-zinc-500">팀</th>
                <th class="pb-2 text-center text-[10px] font-bold text-violet-600">종합</th>
                ${tierHeaders}
                <th class="pb-2 text-center text-[10px] font-bold text-teal-600">팀전</th>
              </tr>
            </thead>
            <tbody>${heatRows}</tbody>
          </table>
        </div>
        </div>
      </div>`;
    }

    function mountLeagueOvrChart(teams, ratingsByTeam) {
      const canvas = document.getElementById('chart-league-ovr');
      if (!canvas || typeof Chart === 'undefined') return;

      const sorted = [...teams]
        .map((t) => ({
          name: t.short || t.name,
          rank: ratingsByTeam[t.teamId]?.leagueRank ?? 6,
          grade: ratingsByTeam[t.teamId]?.overallGrade ?? 'D',
          teamId: t.teamId,
          displayScore: 100 - ((ratingsByTeam[t.teamId]?.leagueRank ?? 6) - 1) * 14,
        }))
        .sort((a, b) => a.rank - b.rank);

      chartInstances.push(
        new Chart(canvas, {
          type: 'bar',
          data: {
            labels: sorted.map((t) => t.name),
            datasets: [
              {
                label: '리그 순위 점수',
                data: sorted.map((t) => t.displayScore),
                backgroundColor: sorted.map((t) => TEAM_CHART_COLORS[t.teamId] || '#6366f1'),
                borderRadius: 6,
                borderSkipped: false,
              },
            ],
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const row = sorted[ctx.dataIndex];
                    return ` ${row.grade}등급 · 종합 ${row.rank}위`;
                  },
                },
              },
            },
            scales: {
              x: {
                min: 0,
                max: 100,
                grid: { color: '#f4f4f5' },
                ticks: { display: false },
              },
              y: {
                grid: { display: false },
                ticks: { font: { size: 11, weight: '600' } },
              },
            },
          },
        }),
      );
    }

    function fixRadarFillColor(hex, alpha = 0.15) {
      const h = hex.replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function mountTeamRadarCharts(teams, ratingsByTeam) {
      if (typeof Chart === 'undefined') return;
      for (const t of teams) {
        const rating = ratingsByTeam[t.teamId];
        const canvas = document.getElementById(`chart-radar-${t.teamId}`);
        if (!canvas || !rating) continue;

        const color = TEAM_CHART_COLORS[t.teamId] || '#7c3aed';
        const data = RADAR_AXES.map((axis) => {
          const rank = rating.axisRanks?.[axis] ?? 6;
          return 100 - (rank - 1) * 14;
        });

        chartInstances.push(
          new Chart(canvas, {
            type: 'radar',
            data: {
              labels: RADAR_AXES,
              datasets: [
                {
                  label: '리그 순위',
                  data,
                  backgroundColor: fixRadarFillColor(color, 0.18),
                  borderColor: color,
                  borderWidth: 2,
                  pointBackgroundColor: color,
                  pointRadius: 3,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => {
                      const axis = RADAR_AXES[ctx.dataIndex];
                      const rank = rating.axisRanks?.[axis] ?? 6;
                      const grade = rating.axisGrades?.[axis] ?? 'D';
                      return ` ${grade} · ${rank}위`;
                    },
                  },
                },
              },
              scales: {
                r: {
                  min: 15,
                  max: 100,
                  ticks: { display: false },
                  grid: { color: '#e4e4e7' },
                  pointLabels: { font: { size: 10, weight: '700' } },
                },
              },
            },
          }),
        );
      }
    }

    function renderLastMatch(lm) {
      if (!lm) return '';
      const won = lm.result === 'W';
      const scoreCls = won ? 'w' : 'l';
      const sets = (lm.sets || [])
        .map((s) => {
          const setWon = !!s.won;
          const ours = (s.ours || []).join(' · ') || '—';
          const theirs = (s.theirs || []).join(' · ') || '—';
          return `<div class="last-match-set ${setWon ? 'won' : 'lost'}">
            <div class="last-match-slot">${escapeHtml(s.label || `S${s.slot}`)}</div>
            <div class="last-match-names"><strong>${escapeHtml(ours)}</strong> <span class="text-zinc-400">vs</span> ${escapeHtml(theirs)}</div>
            <span class="last-match-wl ${setWon ? 'w' : 'l'}">${setWon ? 'W' : 'L'}</span>
          </div>`;
        })
        .join('');
      const mvp =
        lm.mvp
          ? `<span class="text-[11px] text-zinc-500">MVP <strong class="text-zinc-800">${escapeHtml(lm.mvp)}</strong>${lm.mvpSide === 'opp' ? ' <span class="text-zinc-400">(상대)</span>' : ''}</span>`
          : '';
      return `<section>
        <div class="power-section-label">직전 경기 · ${escapeHtml(String(lm.round ?? ''))}R 세트 보드</div>
        <div class="last-match-board">
          <div class="last-match-head">
            <div>
              <p class="text-[11px] font-bold text-zinc-500">vs ${escapeHtml(lm.opponent || '—')}</p>
              <p class="last-match-score ${scoreCls}">${won ? '승' : '패'} ${escapeHtml(lm.score || '')}</p>
            </div>
            ${mvp}
          </div>
          ${sets}
          ${lm.takeaway ? `<p class="last-match-takeaway">${escapeHtml(lm.takeaway)}</p>` : ''}
        </div>
      </section>`;
    }

    function renderTeamCard(t, rating) {
      const rec = t.record || {};
      const next = t.nextRound || {};
      const keys = (t.keyPlayers || [])
        .map(
          (p) => `<li class="rounded-lg border border-zinc-100 bg-zinc-50/80 px-3 py-2">
          <div class="flex items-baseline justify-between gap-2">
            <span class="font-semibold text-zinc-900">${escapeHtml(p.displayName)}</span>
            <span class="text-[10px] font-bold text-indigo-600 shrink-0">${escapeHtml(p.tier || '')}</span>
          </div>
          <div class="text-[10px] font-mono text-zinc-400 mt-0.5">${escapeHtml(p.id || '')}</div>
          <p class="text-[12px] text-zinc-600 mt-1 leading-snug">${escapeHtml(p.note || '')}</p>
        </li>`,
        )
        .join('');

      const summary = (t.summary || [])
        .map((line) => `<li class="text-[13px] leading-relaxed text-zinc-700 pl-3 border-l-2 border-indigo-200">${escapeHtml(line)}</li>`)
        .join('');

      const story = (t.story || [])
        .map((p) => `<p class="text-[13px] leading-[1.7] text-zinc-700">${escapeHtml(p)}</p>`)
        .join('');

      const watch = (t.watchPoints || [])
        .map(
          (w, i) =>
            `<li class="flex gap-2 text-[13px] leading-snug text-zinc-700"><span class="text-indigo-500 font-extrabold tabular-nums shrink-0">${i + 1}</span><span>${escapeHtml(w)}</span></li>`,
        )
        .join('');

      return `<article class="rounded-xl border border-zinc-200 bg-white shadow-sm overflow-hidden">
        <div class="border-b border-zinc-100 bg-gradient-to-r from-zinc-50 to-indigo-50/40 px-4 py-3.5 sm:px-5">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-baseline gap-2 flex-wrap">
                <span class="text-xs font-extrabold text-indigo-600 tabular-nums">#${t.rank}</span>
                <h2 class="text-lg font-bold text-zinc-900">${escapeHtml(t.name)}</h2>
                <span class="text-xs text-zinc-400 font-medium">${escapeHtml(t.short || '')}</span>
                ${rating ? `<span class="text-[11px] font-extrabold tabular-nums rounded px-1.5 py-0.5 border ${rating.overallGrade === 'S' ? 'bg-amber-100 text-amber-800 border-amber-300' : rating.overallGrade === 'A' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-violet-100 text-violet-700 border-violet-200'}" title="종합 TPI ${rating.ovr}">${escapeHtml(rating.overallGrade)} · ${rating.leagueRank}위</span>` : ''}
              </div>
              <p class="mt-1 text-xs text-zinc-500 tabular-nums">
                시리즈 <strong class="text-zinc-800">${rec.seriesW ?? 0}승 ${rec.seriesL ?? 0}패</strong>
                <span class="mx-1 text-zinc-300">·</span>
                세트 <strong class="text-zinc-800">${rec.setW ?? 0}–${rec.setL ?? 0}</strong>
              </p>
            </div>
            <div class="flex items-center gap-1 shrink-0" title="시리즈 결과 (1R→최근)">${formHtml(t.form)}</div>
          </div>
          ${t.tagline ? `<p class="mt-2.5 text-sm font-semibold text-indigo-800/90 leading-snug">“${escapeHtml(t.tagline)}”</p>` : ''}
        </div>

        <div class="p-4 sm:p-5 space-y-5">
          <section>
            <div class="power-section-label">한눈에</div>
            <ul class="space-y-2">${summary}</ul>
          </section>

          ${renderLastMatch(t.lastMatch)}

          ${story ? `<section>
            <div class="power-section-label">시즌 스토리</div>
            <div class="space-y-3">${story}</div>
          </section>` : ''}

          ${t.turningPoint ? `<section class="rounded-lg border border-amber-100 bg-amber-50/60 px-3.5 py-3">
            <div class="power-section-label !text-amber-700">전환점</div>
            <p class="text-[13px] leading-relaxed text-zinc-800">${escapeHtml(t.turningPoint)}</p>
          </section>` : ''}

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <section>
              <div class="power-section-label">강점</div>
              ${listHtml(t.strengths, 'up')}
            </section>
            <section>
              <div class="power-section-label">약점</div>
              ${listHtml(t.weaknesses, 'down')}
            </section>
          </div>

          ${watch ? `<section>
            <div class="power-section-label">관전 포인트</div>
            <ul class="space-y-1.5">${watch}</ul>
          </section>` : ''}

          <section>
            <div class="power-section-label">핵심 선수 · 기여도·코인 기준</div>
            <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2">${keys}</ul>
          </section>

          ${renderTeamPowerIndexSection(t.teamId, rating)}

          ${t.coinOutlook ? `<section class="rounded-lg border border-orange-100 bg-orange-50/50 px-3.5 py-3">
            <div class="power-section-label !text-orange-700">${escapeHtml(t.coinOutlook.title || '출전 코인')}</div>
            <p class="text-[13px] leading-relaxed text-zinc-800">${escapeHtml(t.coinOutlook.body || '')}</p>
          </section>` : ''}

          ${t.verdict ? `<section class="rounded-lg border border-zinc-200 bg-zinc-900 px-3.5 py-3">
            <div class="power-section-label !text-zinc-400">한 줄 평</div>
            <p class="text-[13px] font-semibold leading-relaxed text-white">${escapeHtml(t.verdict)}</p>
          </section>` : ''}

          <section class="rounded-lg border border-indigo-100 bg-indigo-50/50 px-3.5 py-3">
            <div class="power-section-label !text-indigo-600">다음 라운드 전망 · ${escapeHtml(String(next.round ?? ''))}R</div>
            <p class="text-[13px] font-semibold text-zinc-900 mb-1">
              vs ${escapeHtml(next.opponentName || '—')}
              ${next.date ? `<span class="font-normal text-zinc-500"> · ${escapeHtml(next.date)}</span>` : ''}
            </p>
            <p class="text-[13px] leading-relaxed text-zinc-700">${escapeHtml(next.outlook || '')}</p>
          </section>
        </div>
      </article>`;
    }

    async function main() {
      const loading = document.getElementById('loading');
      const mainEl = document.getElementById('main-content');
      const errEl = document.getElementById('load-err');
      try {
        const [powerRes, specialRes, playersRes, fixturesRes] = await Promise.all([
          fetch('data/s11/team-power.json'),
          fetch('data/s11/team-power-roster-special.json'),
          fetch('data/s11/players.json'),
          fetch('data/s11/fixtures.json'),
        ]);
        if (!powerRes.ok) throw new Error(`team-power.json ${powerRes.status}`);
        const data = await powerRes.json();
        const special = specialRes.ok ? await specialRes.json() : null;
        const playersDoc = playersRes.ok ? await playersRes.json() : { players: [] };
        const fixtures = fixturesRes.ok ? await fixturesRes.json() : null;

        let statsByName = {};
        let stateByName = new Map();
        let trimmedRoundDocs = [];
        if (fixtures) {
          const roundDocs = await loadAllSeasonRoundDocs(fixtures);
          const maxRound = data.asOfRound || special?.asOfRound;
          trimmedRoundDocs =
            maxRound != null
              ? roundDocs.filter((d) => d.round != null && d.round <= maxRound)
              : roundDocs;
          ({ statsByName, stateByName } = simulateSeason(fixtures, trimmedRoundDocs, playersDoc.players || []));
        }

        document.getElementById('power-subtitle').textContent =
          data.subtitle || `${data.asOfRound || ''}라운드까지 기준 팀 전력 분석`;
        document.getElementById('power-disclaimer').textContent = data.disclaimer || '';

        if (special?.title) {
          document.getElementById('special-title').textContent = special.title;
          document.getElementById('special-intro').textContent = special.intro || '';
          if (special.methodology) {
            const methEl = document.getElementById('special-method');
            methEl.textContent = special.methodology;
            methEl.classList.remove('hidden');
          }
          document.getElementById('special-banner').classList.remove('hidden');
        }

        const teams = [...(data.teams || [])].sort((a, b) => (a.rank || 99) - (b.rank || 99));
        const teamIds = teams.map((t) => t.teamId).filter(Boolean);
        const ratingsByTeam = computeLeaguePowerRatings(
          playersDoc.players || [],
          statsByName,
          stateByName,
          teamIds,
        );

        const buzz =
          fixtures && trimmedRoundDocs.length
            ? computeHalfSeasonBuzz(playersDoc.players || [], fixtures, trimmedRoundDocs, teams)
            : null;

        const leagueEl = document.getElementById('league-power-index');
        if (leagueEl) {
          leagueEl.innerHTML = renderLeaguePowerSection(teams, ratingsByTeam, buzz);
          leagueEl.classList.remove('hidden');
        }

        destroyCharts();
        const grid = document.getElementById('power-grid');
        grid.innerHTML =
          teams.map((t) => renderTeamCard(t, ratingsByTeam[t.teamId])).join('') ||
          '<p class="text-sm text-zinc-500">분석 데이터가 없습니다.</p>';
        mountLeagueOvrChart(teams, ratingsByTeam);
        mountTeamRadarCharts(teams, ratingsByTeam);

        loading.classList.add('hidden');
        mainEl.classList.remove('hidden');
      } catch (e) {
        console.error(e);
        loading.classList.add('hidden');
        errEl.textContent = e.message || String(e);
        errEl.classList.remove('hidden');
      }
    }

    main();
  </script>
</body>
</html>
